name: GitHub Pages に公開

# main に変更が入るたびに、アプリをビルドして GitHub Pages に公開する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

      # ※ リポジトリの Settings → Pages の「Source」を「GitHub Actions」にしておくこと
      #   （「Deploy from a branch」のままだと、ビルド前のファイルで上書きされて画面が真っ白になる）
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
